# ════════════════════════════════════════════════════════════════════════════
# M5Stack PaperS3 (SKU C139) — ESP32-S3R8, 16MB flash / 8MB OPI PSRAM,
# 4.7" 960x540 16-gray ET047TC1 e-paper driven DIRECTLY over an 8-bit parallel
# bus (no SPI controller, no IT8951), GT911 touch, BM8563 RTC, PMS150G power IC.
#
# Board support comes from M5GFX >= 0.2.33 (board_M5PaperS3: Bus_EPD +
# Panel_EPD 16-gray LUT) and M5Unified (power/RTC/touch/battery board profile).
# Both are pinned to the versions this port was validated against so the build
# is reproducible. M5GFX refuses to bring up the PaperS3 panel unless the ESP32
# is built with OPI PSRAM (CONFIG_SPIRAM_MODE_OCT), hence the qio_opi memory
# type + psram_type = opi below.
#
# Platform: espressif32@8.0.0 == arduino-esp32 3.3.12 / IDF 5.x. The older
# 6.x platform (arduino-esp32 2.0.17) does not ship an OPI-PSRAM S3 variant with
# CONFIG_SPIRAM_MODE_OCT, so PaperS3 support MUST use 8.0.0. Only this env
# overrides the platform; [common] stays unpinned so all other boards keep the
# core version they had before.
#
# Flashing: native USB-C (USB Serial/JTAG). Serial logs are routed to USB CDC.
#   pio run -e epd_47_m5papers3_s3 -t upload
#   pio device monitor -e epd_47_m5papers3_s3     # /dev/cu.usbmodem*
# See FLASH_M5PAPERS3.md for the full guide.
# ════════════════════════════════════════════════════════════════════════════
[env:epd_47_m5papers3_s3]
extends = common
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/inksight_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
# arduino-esp32 3.x split the network stack into the "Networking" library
# (libraries/Network/src/Network.h). WiFi/WebServer headers include it from
# inside library sources, so PlatformIO's default "chain" LDF does not see the
# dependency and the WiFi headers fail to compile. "deep+" makes LDF scan
# library sources for includes as well.
lib_ldf_mode = deep+
build_flags =
    # arduino-esp32 3.x moved WiFiClientSecure / Network into separate framework
    # libraries. Third-party libraries (links2004/WebSockets) `#include <WiFi.h>`
    # from inside their own sources, which PlatformIO's LDF does not resolve to
    # framework libraries, so expose the framework include dirs explicitly.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DBOARD_PROFILE_M5PAPERS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=960
    -DEPD_HEIGHT=540
    -DEPD_BPP=1
    -DEPD_PANEL_47_M5PAPERS3
    -DALLOW_INSECURE_FALLBACK=0
lib_deps =
    m5stack/M5GFX@0.2.33
    m5stack/M5Unified@0.2.26
    links2004/WebSockets@^2.6.1

# ════════════════════════════════════════════════════════════════════════════
# M5Stack PaperDIY (K159 / K159-B) — same ESP32-S3R8 (16MB flash / 8MB OPI PSRAM)
# and same 4.7" 960x540 16-gray ET047TC1 panel + 8-bit parallel bus as PaperS3.
# Differences handled by the BOARD_PROFILE_M5PAPERDIY build flag:
#   * EPD_PWR is switched by the M5PM1 PMIC (GPIO2/PYG2), not a direct ESP32 pin
#     (M5GFX board_M5PaperDIY autodetect does this before panel init)
#   * power/battery/charge status via M5PM1, no PMS150G and no BM8563 RTC
#   * no GT911 touch; two user buttons: ButtonA=GPIO4 (config), ButtonB=GPIO3
#   * deep sleep keeps the M5PM1 3V3 rail up; ButtonA can wake the device
# Everything else (platform pin, OPI PSRAM requirement, 16MB layout, M5GFX /
# M5Unified versions, USB-CDC logging, LDF include workarounds) is identical to
# the PaperS3 env above. Keep the two envs in sync if one of them changes.
#
# Flashing: native USB-C (USB Serial/JTAG), logs over USB CDC.
#   pio run -e epd_47_m5paperdiy_s3 -t upload
#   pio device monitor -e epd_47_m5paperdiy_s3     # /dev/cu.usbmodem*
# See FLASH_M5PAPERDIY.md for the full guide.
# ════════════════════════════════════════════════════════════════════════════
[env:epd_47_m5paperdiy_s3]
extends = common
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/inksight_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_ldf_mode = deep+
build_flags =
    # Same arduino-esp32 3.x framework include workaround as the PaperS3 env:
    # third-party libs include WiFi.h/FS.h from inside their own sources.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DBOARD_PROFILE_M5PAPERDIY
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEPD_WIDTH=960
    -DEPD_HEIGHT=540
    -DEPD_BPP=1
    -DEPD_PANEL_47_M5PAPERDIY
    -DALLOW_INSECURE_FALLBACK=0
lib_deps =
    m5stack/M5GFX@0.2.33
    m5stack/M5Unified@0.2.26
    links2004/WebSockets@^2.6.1
